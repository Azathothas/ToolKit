# Publish wsl-toolkit executables as a GitHub release, from the tag that triggered this.
#
# ⭐ THE PUBLISHER IS HERE AND NOWHERE ELSE. `repo release --publish`
# verifies and pushes the tag; this checks that tag out CLEAN and re-runs
# verification before anything is published. A release cut from a developer's
# machine could come from a dirty tree, an unpushed commit or a build of edits
# nobody committed, and none of those is visible in the artefact afterwards.
#
# ⛔ Third-party actions are pinned to a COMMIT, not a tag, for the reason
# .github/workflows/ci.yml states: a moved tag runs code nobody reviewed with the
# permissions granted here.

name: release

on:
  push:
    tags:
      - 'wsl-toolkit-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: the existing tag to publish
        required: true

permissions:
  contents: read

jobs:
  # ⭐ herdr's NEWEST STABLE RELEASE IS PUBLISHED INSIDE EACH wsl-toolkit RELEASE, by the
  # operator's ruling of 2026-09-15, built by the same workflow that builds the nightly
  # and signed below with this workflow's identity. WSL-90.
  herdr-stable-ref:
    name: herdr's newest stable release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      label: ${{ steps.ref.outputs.label }}
    steps:
      - id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/herdrdev/herdr/releases/latest --jq .tag_name)
          if ! printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "herdr's newest stable release is tagged '$tag', which is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "herdr's newest stable release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "label=herdr-${tag#v}" >> "$GITHUB_OUTPUT"

  herdr-stable:
    name: herdr's newest stable release, built
    needs: herdr-stable-ref
    uses: ./.github/workflows/herdr-build.yml
    with:
      ref: ${{ needs.herdr-stable-ref.outputs.tag }}
      label: ${{ needs.herdr-stable-ref.outputs.label }}

  publish:
    name: publish wsl-toolkit
    needs: [herdr-stable-ref, herdr-stable]
    runs-on: windows-latest
    timeout-minutes: 20
    # ⛔ Raised for this job alone. Every other job in this repository reads.
    # ⛔ id-token IS A SECOND RAISE AND IT IS NOT THE SAME ONE. contents:write
    # lets this job publish; id-token:write lets it mint the short-lived OIDC
    # token `cosign sign-blob` exchanges for a signing certificate. Neither
    # implies the other, and the signing step below is the only reason the
    # second exists. WSL-25.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # ⛔ THE TAG AND THE SOURCE MUST AGREE. A tag naming a version the published
      # asset does not carry is the worst kind of release: every later report
      # about it is about a different file.
      - name: the tag names the executable's one version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $text = [IO.File]::ReadAllText('.\tools\windows\wsl-toolkit\internal\toolkit\version.go')
          $m = [regex]::Matches($text, '(?m)^const Version = "([0-9]+\.[0-9]+\.[0-9]+)"$')
          if ($m.Count -ne 1) { Write-Output "version.go carries $($m.Count) product version declarations"; exit 1 }
          $want = 'wsl-toolkit-v' + $m[0].Groups[1].Value
          if ($tag -ne $want) { Write-Output "tag is '$tag' and the file says '$want'"; exit 1 }
          Write-Output "tag and native version agree: $tag"

      # ⚠ THE RUNTIME THIS TAG DECLARES WAS CHECKED, not only that the tag
      # resolves. Resolved on 2026-09-10, and the commit it answered is the one
      # pinned on the line below rather than repeated here:
      #   gh api repos/actions/setup-go/git/ref/tags/v7.0.0 --jq .object.sha
      # It declares node24, which is current.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/windows/wsl-toolkit/go.mod
          cache: false

      # ⛔ THE COMPILED PRODUCT IS PROVED BEFORE IT IS PUBLISHED, with the same
      # check the local gate and CI run. A release is the one place where "it
      # built on somebody's machine" is not an answer.
      - name: gofmt, vet, build and test
        shell: bash
        run: sh scripts/common/check-go.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: herdr-build-${{ needs.herdr-stable-ref.outputs.label }}-*
          path: herdr-artifacts
          merge-multiple: true

      # ⭐ THE DIGESTS ARE COMPUTED OVER THE BYTES THAT ARE UPLOADED, in this
      # checkout, so a consumer verifying a download against SHA256SUMS is
      # checking the same object. A digest computed anywhere else would be a
      # digest of a different line ending.
      #
      # ⛔ -trimpath, AND NO BUILD STAMP. Two builds of one commit produce
      # identical bytes, so a consumer can rebuild and compare rather than
      # trusting the publisher. A path or a timestamp compiled in would make
      # every build unique and that property unavailable.
      - name: stage the assets and write SHA256SUMS
        shell: pwsh
        env:
          HERDR_LABEL: ${{ needs.herdr-stable-ref.outputs.label }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Push-Location tools\windows\wsl-toolkit
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOOS = 'windows'; $env:GOARCH = $arch; $env:CGO_ENABLED = '0'
            $out = "..\..\..\dist\wsl-toolkit-windows-$arch.exe"
            & go build -trimpath -o $out .
            if ($LASTEXITCODE -ne 0) { Write-Output "the $arch build failed"; exit 1 }
          }
          Pop-Location
          $herdr = @('windows-x86_64.zip', 'windows-aarch64.zip', 'linux-x86_64', 'linux-aarch64') | ForEach-Object { "$env:HERDR_LABEL-$_" }
          foreach ($name in $herdr) {
            $built = Join-Path 'herdr-artifacts\out' $name
            if (-not (Test-Path -LiteralPath $built)) { Write-Output "$built was not built"; exit 1 }
            Copy-Item -LiteralPath $built -Destination (Join-Path 'dist' $name)
          }
          # ⛔ THE COUNT IS ASSERTED. A staging step that produced fewer assets
          # than expected and exited 0 would publish a release missing the thing
          # a consumer came for, and the release would look complete.
          $expected = @('wsl-toolkit-windows-amd64.exe', 'wsl-toolkit-windows-arm64.exe') + $herdr
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath "dist\$name")) { Write-Output "dist\$name was not staged"; exit 1 }
          }
          $lines = @()
          foreach ($f in (Get-ChildItem dist -File | Sort-Object Name)) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += ($h + '  ' + $f.Name)
            Write-Output ($h + '  ' + $f.Name + '  (' + $f.Length + ' bytes)')
          }
          if ($lines.Count -ne $expected.Count) { Write-Output "staged $($lines.Count) assets and expected $($expected.Count)"; exit 1 }
          [IO.File]::WriteAllText('dist\SHA256SUMS', (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))

      # ⛔ THE PUBLISHED BINARY IS RUN BEFORE IT IS PUBLISHED, and it is asked
      # the one question whose answer proves it carries the tag's version.
      # A binary that builds and cannot start is a release nobody can use.
      - name: the staged binary runs and agrees with the tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $out = & .\dist\wsl-toolkit-windows-amd64.exe version
          if ($LASTEXITCODE -ne 0) { Write-Output "the staged binary exited $LASTEXITCODE"; exit 1 }
          $want = 'wsl-toolkit-v' + ($out | Select-Object -First 1).Trim()
          if ($tag -ne $want) { Write-Output "tag is '$tag' and the binary says '$want'"; exit 1 }
          Write-Output "the staged binary reports $out, which matches $tag"

      # ⭐ THE SIGNATURE IS WHAT SHA256SUMS CANNOT BE. That file ships in the
      # same release as the asset it describes, so anyone who could replace one
      # could replace the other. A keyless signature is tied to THIS workflow's
      # OIDC identity, which nothing outside this repository can mint. WSL-25.
      #
      # ⚠ KEYLESS MEANS THERE IS NO KEY TO LOSE, and what it costs is a
      # dependency on the public transparency log at verify time. Ruled on
      # 2026-08-30 over minisign, which has the opposite trade.
      #
      # ⛔ EVERY PUBLISHED ASSET IS SIGNED, SHA256SUMS INCLUDED. Signing the
      # sums alone would be a shorter chain that is only as good as a consumer
      # remembering to walk it; a consumer who fetched one asset can verify that
      # asset. The list is captured BEFORE the loop, because writing bundles into
      # the same directory the loop enumerates would sign the signatures.
      # ⚠ THE COSIGN VERSION IS PINNED, not left to the installer's default. The
      # bundle `--bundle` writes changed format between cosign 2 and 3, and a
      # signer and a verifier that disagree about it produce a signature nobody
      # can check. release-smoke.yml verifies with the same version, from outside
      # this workflow.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: sign every asset with a keyless signature
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem dist -File | Sort-Object Name | ForEach-Object { $_.Name })
          if ($assets.Count -ne 7) { Write-Output "expected 7 assets to sign and found $($assets.Count)"; exit 1 }
          foreach ($name in $assets) {
            & cosign sign-blob --yes --bundle "dist\$name.cosign.bundle" "dist\$name"
            if ($LASTEXITCODE -ne 0) { Write-Output "signing $name exited $LASTEXITCODE"; exit 1 }
          }
          # ⛔ THE EFFECT IS VERIFIED, not inferred from an exit code. A step
          # that can only pass is the `exits 0 having done nothing` row in
          # docs/conventions/forbidden-patterns.md.
          foreach ($name in $assets) {
            $bundle = "dist\$name.cosign.bundle"
            if (-not (Test-Path -LiteralPath $bundle)) { Write-Output "$bundle was not written"; exit 1 }
            if ((Get-Item -LiteralPath $bundle).Length -le 0) { Write-Output "$bundle is empty"; exit 1 }
            Write-Output ("signed " + $name + " -> " + (Split-Path -Leaf $bundle))
          }

      # ⛔ THE SIGNATURES ARE VERIFIED BEFORE THEY ARE PUBLISHED, with the
      # same command and the same identity a consumer uses. A bundle that cannot
      # be verified is worse than none: it is a claim of authorship that fails
      # the first time somebody checks it, on a release that has already shipped.
      - name: the signatures verify against this workflow's identity
        shell: pwsh
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          $assets = @(Get-ChildItem dist -File -Filter '*.cosign.bundle' | ForEach-Object { $_.Name -replace '\.cosign\.bundle$', '' })
          if ($assets.Count -ne 7) { Write-Output "expected 7 bundles and found $($assets.Count)"; exit 1 }
          foreach ($name in $assets) {
            & cosign verify-blob `
              --bundle "dist\$name.cosign.bundle" `
              --certificate-identity $env:IDENTITY `
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' `
              "dist\$name"
            if ($LASTEXITCODE -ne 0) { Write-Output "verifying $name exited $LASTEXITCODE"; exit 1 }
            Write-Output "verified $name against $env:IDENTITY"
          }

      # --generate-notes writes the body from the commits since the previous tag.
      # ⛔ No hand-written body: one that is typed here goes stale the first time
      # somebody forgets to edit it, and the commits cannot.
      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          gh release create $tag `
            (Get-ChildItem dist -File | ForEach-Object { $_.FullName }) `
            --title $tag `
            --generate-notes `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "published $tag"

  # ⛔ THE PUBLISH IS NOT THE LAST WORD. Everything above runs against the tree
  # and the staging directory; this fetches what was actually uploaded and
  # drives it from a temp directory with no repository present. TOOL-12.
  # ⭐ One definition, called from here and run weekly on its own schedule:
  # .github/workflows/release-smoke.yml.
  smoke:
    name: the published release can be consumed
    needs: publish
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
