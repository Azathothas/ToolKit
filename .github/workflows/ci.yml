# The gates, in CI. Part (a) of the three-part gate: docs/methodology/gate.md
#
# This runs the SAME checks the local gate runs. It is a second place they run,
# not a second set of rules. When they diverge, the local one is what a session
# actually experiences and this one is the defect.
#
# ⛔ Two hosts, on purpose. This repository's scripts are POSIX sh AND Windows
# PowerShell, and a check that only ever runs on ubuntu proves nothing about the
# host half of them are written for.
#
# ⛔ Third-party actions are pinned to a COMMIT, not a tag. A tag moves, and a
# moved tag runs code nobody reviewed with the permissions granted here:
#
#   gh api repos/actions/checkout/git/ref/tags/v7 --jq .object.sha
#
# ⚠ AND CHECK WHAT RUNTIME THE TAG DECLARES, not merely that it resolves.
# ⭐ The durable fix is .github/dependabot.yml. Pinning without an updater is
# how a pin becomes a fossil.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. No job here needs more than reading the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -- the POSIX half --------------------------------------------------------
  checks:
    name: checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠ THE EXIT CODE IS CAPTURED, NOT ECHOED AFTER THE FACT. GitHub runs
      # `run:` under `bash -e`, so a non-zero probe aborts the step before any
      # echo, and an echo could therefore only ever print 0. That reads like a
      # verification and asserts nothing.
      - name: the probe runs and exits 0
        run: |
          set +e
          sh scripts/doctor/doctor.sh --fast >/dev/null
          rc=$?
          set -e
          echo "probe exit=$rc"
          [ "$rc" = 0 ]

      # ⛔ THE VERSION COMES FROM go.mod, never from a number typed here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/check/go.mod
          cache: false

      - name: shellcheck, which the gate runs and this host has a different one of
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # ⭐ ONE STEP, AND IT IS THE COMMAND A SESSION RUNS. Every rule this
      # repository enforces over its own tree lives in tools/check, so a list of
      # steps here would be a second list to fall out of step with that one.
      # ⚠ The shellcheck it finds is this host's, which is not the one on a
      # development machine: docs/methodology/gate.md carries what that costs.
      # ⛔ A CHECKOUT IS A CHECKOUT, and the gate's `hooks` rule has no
      # exemption for this one. Hooks are not cloned, so every checkout has to
      # opt in, and CI opting in the same way a laptop does is what keeps that
      # rule from growing an "unless it is CI" branch. It also means this job
      # would catch a hook that stopped working.
      - name: install the tracked hooks, like any other checkout
        run: git config core.hooksPath .githooks

      - name: the gate
        run: sh scripts/common/check-gate.sh

      # ⭐ THE SELFTEST RUNS ON BOTH JOBS, and this half is not redundant with
      # the Windows one. The renderer it tests reads the host's culture, and one
      # of its cases exists because a .NET custom format string treats ':' as a
      # culture-dependent placeholder. A second host, with a different default
      # culture and a different PowerShell build, is exactly the second sample
      # that claim needs.
      - name: the wsl-toolkit selftest, on this host too
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/windows/wsl-toolkit/selftest.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ⛔ ENUMERATED BY git, NOT BY glob, AND THE COUNT IS ASSERTED.
      # `glob.glob('**/*.yml', recursive=True)` SKIPS DOT-DIRECTORIES, and every
      # yaml file in this repository lives under `.github/`. So this step
      # iterated zero files, printed nothing and exited 0 for as long as it
      # existed: a workflow edit could not have been caught by it. That is the
      # "step that exits 0 having done nothing it was asked to do" row in
      # docs/conventions/forbidden-patterns.md, in this repository's own CI.
      # ⭐ A step that can only pass verifies its own effect, which here means
      # refusing an empty scope rather than reporting green over it.
      # ⚠ chr(0) rather than a backslash escape: the payload crosses a shell.
      - name: yaml parses
        run: |
          python3 -c "
          import subprocess, sys
          try:
              import yaml
          except ImportError:
              sys.exit('pyyaml missing')
          out = subprocess.run(['git', 'ls-files', '-z', '*.yml', '*.yaml'],
                               capture_output=True, text=True, check=True).stdout
          names = [n for n in out.split(chr(0)) if n]
          if not names:
              sys.exit('no yaml file in scope, so this step cannot report a pass')
          bad = 0
          for f in names:
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print('ok  ', f)
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          print(str(len(names)) + ' file(s) parsed')
          sys.exit(bad)
          "

  # -- the Windows half: where the PowerShell in this repository actually runs -
  windows:
    name: powershell (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ EVERY tracked .ps1, not a hardcoded list. A list is a thing somebody
      # forgets to extend, and the script they forgot is the one that breaks.
      # ⛔ THE VERSION COMES FROM go.mod, never from a number typed here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/check/go.mod
          cache: false

      - name: the probe runs and emits valid json
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts\doctor\doctor.ps1 -Json > ps.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $d = Get-Content ps.json -Raw | ConvertFrom-Json
          if ($d.schema -ne 'agent-doctor/1') { Write-Output "wrong schema: $($d.schema)"; exit 1 }
          Write-Output ("schema " + $d.schema + ", " + $d.tools.Count + " tools")

      # ⭐ THE POINT OF THIS JOB. Each check has a PowerShell twin because the
      # sh one cannot be assumed to run on Windows: a native PowerShell session
      # may have no `sed`, and its `sort` is an alias for Sort-Object, which
      # succeeds and answers differently. ⛔ Running them on ubuntu under pwsh
      # would prove nothing about that.
      # ⭐ THE SAME GATE, ON THE HOST THIS REPOSITORY IS DEVELOPED ON. It used to
      # be a second set of steps running each check's PowerShell twin, which is
      # what the twin rule existed to keep honest. There is one implementation
      # now, and this runs it through the PowerShell entry point so that path is
      # exercised rather than assumed.
      - name: install the tracked hooks, like any other checkout
        run: git config core.hooksPath .githooks

      - name: the gate, through the PowerShell entry point
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/common/check-gate.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ⭐ BOTH POWERSHELL HOSTS, AND THAT IS THE WHOLE POINT OF THIS STEP.
      # Every P0 this tool has ever had lived in Windows PowerShell 5.1 and was
      # invisible on 7: WSL-12, where -Action New failed outright, and the double
      # quote 5.1 drops when it builds a child process argument list. Until now
      # 5.1 was checked by hand, twice, and an open question about it was carried
      # for a week because nothing automatic could answer it. TOOL-11.
      #
      # ⛔ BESIDE, NOT INSTEAD. Two hosts is the point; replacing one with the
      # other trades a blind spot for a different blind spot.
      #
      # ⛔ THE CASE COUNTS ARE COMPARED RATHER THAN TYPED. A suite that stopped
      # early exits 0 over a smaller suite on either host, and a number written
      # here would be a number to update on every case added. The two hosts
      # running the same file must reach the same count, and if they do not, one
      # of them stopped somewhere.
      - name: the selftest on both PowerShell hosts, with the counts compared
        shell: pwsh
        run: |
          $seven = pwsh -NoProfile -File .\scripts\windows\wsl-toolkit\selftest.ps1 -Json
          if ($LASTEXITCODE -ne 0) { Write-Output "pwsh 7: $seven"; exit 1 }
          $five = powershell.exe -NoProfile -File .\scripts\windows\wsl-toolkit\selftest.ps1 -Json
          if ($LASTEXITCODE -ne 0) { Write-Output "Windows PowerShell 5.1: $five"; exit 1 }
          $a = $seven | ConvertFrom-Json
          $b = $five  | ConvertFrom-Json
          Write-Output ("pwsh 7: $($a.cases) case(s) over $($a.functions) function(s)")
          Write-Output ("5.1   : $($b.cases) case(s) over $($b.functions) function(s)")
          if ($a.cases -lt 1) { Write-Output "the suite ran no cases at all"; exit 1 }
          if ($a.cases -ne $b.cases -or $a.functions -ne $b.functions) {
            Write-Output "the two hosts ran different suites, so one of them stopped early"
            exit 1
          }


  # -- the compiled half. Two hosts, because it is written for one and has to
  #    keep building on the other: the ubuntu job is what caught a guard that
  #    split a path with the RUNNING host's separators, on a tool that only ever
  #    runs on Windows.
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ THE VERSION COMES FROM go.mod, never from a number typed here. A
      # duplicated floor drifts the first time somebody raises one of them, and
      # the failure is a build that works locally and not in CI.
      # ⚠ THE RUNTIME THIS TAG DECLARES WAS CHECKED, not only that the tag
      # resolves. Resolved on 2026-09-10, and the commit it answered is the one
      # pinned on the line below rather than repeated here:
      #   gh api repos/actions/setup-go/git/ref/tags/v7.0.0 --jq .object.sha
      # It declares node24, which is current.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/windows/wsl-toolkit/go.mod
          # ⛔ CACHING IS OFF. This module has no dependencies at all, so there
          # is nothing to cache and a cache-dependency-path naming a go.sum that
          # does not exist fails the step by name.
          cache: false

      # ⭐ THE SAME CHECK THE LOCAL GATE RUNS, not a second list of steps. When
      # this and scripts/common/check-go.sh disagree about what is checked, this
      # one is the defect.
      - name: gofmt, vet, build and test
        shell: bash
        run: sh scripts/common/check-go.sh

      # ⛔ THE EMBEDDED SCRIPT IS THE TRACKED ONE, and this is where that is
      # provable on a Linux checkout as well as a Windows one. The two copies
      # differ by line endings alone and the executable reconstructs the
      # tracked bytes exactly; a checkout that broke that would build a binary
      # running a script nobody published.
      - name: the executable carries the published script
        shell: bash
        run: |
          cd tools/windows/wsl-toolkit
          go test ./internal/script/ -run TestStoredCopyReconstructsTheProduct -v

      # ⭐ CROSS COMPILED HERE TOO, so a release cannot be the first time an
      # architecture is built. Nothing in this tool uses cgo, so both targets
      # build from either host.
      - name: both release targets build
        shell: bash
        run: |
          cd tools/windows/wsl-toolkit
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -o "/tmp/wsl-toolkit-$arch.exe" .
            ls -l "/tmp/wsl-toolkit-$arch.exe"
          done

  # -- the guards are guards. The instrument nobody was running -------------
  #
  # ⛔ WHY THIS IS A JOB AND NOT A GATE CHECK. `repo mutate` deletes each guard
  # in tools/repo/mutations.json and runs the case named for it, one copied
  # module and one `go test` per row. That takes minutes, and a gate that takes
  # minutes is a gate a session skips. The gate carries the cheap half instead,
  # `check mutations`, which asserts every row still POINTS at something; this
  # job carries the half that asks whether the case actually goes red.
  #
  # ⭐ ON UBUNTU BECAUSE OF WHAT SKIPS ON WINDOWS. Creating a symbolic link there
  # needs developer mode or an elevated process, so the case for the workspace
  # link guard excuses itself and the row is unproved on the operator machine.
  # It runs here. ⚠ The harness reports such a row as SKIPPED rather than as
  # theatre, and it used to conflate the two.
  mutations:
    name: the guards go red when the guard is gone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ THE VERSION COMES FROM go.mod, never from a number typed here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/repo/go.mod
          cache: false

      # ⚠ THE EXIT CODE IS READ FROM THE PROCESS, unpiped. The harness exits 1
      # on a theatre row and on a broken one, and 0 when the only unproved rows
      # are ones this host could not reach - which here should be none.
      - name: every row of the mutation table
        shell: bash
        run: |
          cd tools/repo
          go run . mutate

  # -- the two probes must agree. The drift rule, with a machine behind it ----
  twins:
    name: the two probes agree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: both probes, same machine, compared field by field
        shell: bash
        run: sh scripts/common/check-twins.sh
