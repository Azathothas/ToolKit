# tmux.conf - a long-running agent session that survives the terminal closing,
# and that cannot be quit by one wrong key.
#
# THE DEFECT IT EXISTS TO CATCH: an agent that was running in a terminal window
# somebody closed, or that was killed by the key next to the one they meant. The
# work is gone and so is the output that would have said how far it got.
#
# Install it as ~/.tmux.conf. `bootstrap-linux.sh` does that; by hand it is
#   install -m 0644 tmux.conf ~/.tmux.conf
#
# ⚠ EVERY OPTION HERE IS ONE tmux 3.0 ACCEPTS, and the window and server options
# are spelled `setw -g` and `set -s` rather than `set -g`. A bare `set -g` over a
# window option is an error on an older tmux, and the config then loads
# PARTIALLY: tmux starts, the line that failed did nothing, and the session looks
# configured.

# ---------------------------------------------------------------- the keys ---

# ⭐ TWO PREFIXES, because the one you remember is the one that should work.
# M-g is the operator's own habit; C-b is what every other machine has.
set -g  prefix  M-g
set -g  prefix2 C-b
bind-key M-g send-prefix

# Without a prefix at all: pick a session. This is the key the whole
# attach-and-detach story rests on, so it is the one that costs nothing.
bind-key -n M-s choose-session

# With a prefix, the ordinary shapes.
bind-key M-h split-window -h
bind-key M-v split-window -v
bind-key M-n new-window
bind-key r   source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# ------------------------------------------------------- surviving the exit ---

# ⭐ THE THREE THAT MAKE A SESSION OUTLIVE ITS TERMINAL. A pane whose command
# ended stays visible with its output; a session with no windows left is not
# destroyed; and the last client detaching does not take the server with it.
setw -g remain-on-exit on
set  -g detach-on-destroy off
set  -s exit-empty off

# A dead pane is deliberately kept, so there has to be a way to reuse one.
bind-key R respawn-pane -k

# ⛔ THE EASY KILL KEYS ARE GONE. `x` and `&` are one key away from keys used all
# day, and both end something that took hours. An intentional kill is the
# capital letter and it still asks.
unbind-key x
unbind-key '&'
bind-key X confirm-before -p 'kill this pane? (y/n)'    kill-pane
bind-key K confirm-before -p 'kill session #S? (y/n)'   kill-session

# ---------------------------------------------------------- reading and use ---

set -g  mouse on
setw -g mode-keys vi
set -g  history-limit 100000

# Numbering that matches the keyboard, and a list that stays dense when a window
# in the middle goes away.
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
setw -g automatic-rename on
set  -g set-titles on

set -g  default-terminal 'screen-256color'
set -s  escape-time 10
set -s  focus-events on
set -g  display-time 2000

# ⭐ THE KEYS ARE ON THE SCREEN, so none of them has to be remembered. This is
# the whole answer to not wanting to learn a multiplexer: the status line is the
# manual.
set -g status-left  '[#S] '
set -g status-right ' detach: prefix d | sessions: M-s | kill: prefix K | %H:%M '
set -g status-left-length  30
set -g status-right-length 70

# ⚠ NO PLUGIN MANAGER, AND THAT IS DELIBERATE. A `run '~/.tmux/plugins/tpm/tpm'`
# line needs a clone that has to happen before the first session and a manual
# install key after it. On a machine where neither has happened tmux prints an
# error for every new session and the status line is the default one. A
# configuration for an unattended base carries no step a human has to perform.
