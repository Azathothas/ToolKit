# Written by wsl-toolkit's herdr adapter while base.adapters gives herdr
# "private_net": true, as a drop-in so the server's own unit keeps its bytes.
# base ensure rewrites it, and removes it when the key goes. WSL-159.
[Unit]
# ⛔ REQUIRED AND ORDERED AFTER, so a namespace that could not be linked keeps the
# server stopped rather than starting it in the shared namespace.
Requires=wsl-toolkit-herdr-net.service
After=wsl-toolkit-herdr-net.service

[Service]
# The server, and every pane and agent it starts, in the namespace that unit links.
NetworkNamespacePath=/run/netns/wsl-toolkit-herdr
# ⛔ NO PRIVILEGE IS GAINED IN HERE, so sudo and every setuid program refuse: guest
# root can leave any namespace, which would make the confinement a claim.
NoNewPrivileges=yes
# ⛔ THE ACCOUNT'S USER MANAGER AND ITS ENGINE'S STATE ARE HIDDEN. Both run in the
# shared namespace, so `systemd-run --user` or a rootless container would start a
# process outside this one on an agent's behalf.
InaccessiblePaths=-/run/user
