# A provider session should survive a closed terminal and an accidental `exit`.
# Detach: Ctrl-b d. Reattach: tmux attach -t NAME.
set -g remain-on-exit on
set -g detach-on-destroy off
set -g exit-empty off

# Remove the easy kill-pane/window keys. An intentional session kill is Ctrl-b
# K and still asks for confirmation.
unbind-key x
unbind-key '&'
bind-key K confirm-before -p 'Kill session #S? (y/n)' kill-session

# Keep enough history for a long provider session and make status unambiguous.
set -g history-limit 100000
set -g status-left '[#S] '
set -g status-right '#(date +%%H:%%M)'
